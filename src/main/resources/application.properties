spring.application.name=Bookvault
server.port=8080

# Allow large PDF uploads (matches the 100 MB limit in the BookVault UI)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Turn off every model type we do not use
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
# The OpenAI starter is used for chat only (Groq), so its embeddings stay off
spring.ai.model.embedding=none
spring.ai.model.embedding.text=google-genai
# Only the OpenAI-compatible chat model (Groq) is used for chat, not Gemini chat
spring.ai.model.chat=openai

# Embeddings: Google Gemini (set GEMINI_API_KEY in your environment)
spring.ai.google.genai.embedding.api-key=AQ.Ab8RN6IjoRlL7ge6j7xmeGJ3deWx712vNVMuThvsT0wg
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=1024

# Chat: Groq through its OpenAI-compatible endpoint (set GROQ_API_KEY)
spring.ai.openai.chat.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.api-key=gsk_8YMMfMtDa8Av0OfpemB7WGdMgdpD2Xf0utiqjsGY
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.chat.temperature=0.2

# Vector store: Pinecone (set PINECONE_API_KEY)
# Create the index first: dimension 3072 (gemini-embedding-001), metric cosine.
spring.ai.vectorstore.pinecone.api-key=pcsk_3vt7oQ_RHeh6cmgeV9RjQMaNFwZagzM6wEQpF8RqKEU3cWe8nSL3t6T2pCV
spring.ai.vectorstore.pinecone.index-name=bookvault-vector-api
spring.ai.vectorstore.pinecone.namespace=bookvault

app.rag.chunk-size=800
app.rag.summary-top-k=20
app.rag.answer-top-k=6
app.rag.similarity-threshold=0.0
